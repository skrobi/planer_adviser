name: Knowledge contract and engine tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

jobs:
  knowledge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run knowledge contract tests
        run: python -m unittest discover -s tests -v
      - name: Execute JSON-driven Adventure Engine
        id: runner
        if: always()
        run: python tests/adventure_engine_runner.py
      - name: Verify scenario recommendations
        if: always() && steps.runner.outcome == 'success'
        run: python tests/verify_adventure_engine.py
      - name: Upload execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adventure-engine-test-results
          path: |
            tests/generated_results.json
            tests/verification_report.json
